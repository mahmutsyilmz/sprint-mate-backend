# =============================================
# Sprint Mate - Production Configuration
# =============================================
# Activate with: --spring.profiles.active=prod

# Server
server.port=${PORT:8080}

# Database - All values from environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA - Validate only, never auto-modify schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Initialization - Disabled in production
spring.sql.init.mode=never

# H2 Console - Disabled in production
spring.h2.console.enabled=false

# Swagger UI - Disabled in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Flyway - Enabled for production schema management
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Frontend URL (Vercel domain) - set FRONTEND_URL env var in Railway.
# Example: FRONTEND_URL=https://sprint-mate.vercel.app
# Defaults to localhost so the app can start during initial Railway setup.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# CORS - same as FRONTEND_URL; update once Vercel is deployed.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# =============================================
# Session Cookie - Cross-Origin (Vercel + Railway)
# =============================================
# SameSite=None required for cookies to be sent across different domains.
# Secure=true is mandatory when SameSite=None (HTTPS only).
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=JSESSIONID

# Disable bot seeding in production
sprintmate.seed-bot-users=false

# Actuator - Expose only health and info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.root=WARN
logging.level.com.sprintmate=INFO
logging.level.org.hibernate.SQL=OFF
